global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'porta-mundi-monitor'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Guacamole daemon health
  - job_name: 'guacd'
    static_configs:
      - targets: ['localhost:4822']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Porta-Mundi Gateway metrics
  - job_name: 'porta-mundi-gateway'
    static_configs:
      - targets: ['localhost:8822']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # System metrics via node_exporter (optional, if available)
  - job_name: 'system'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 30s
    scrape_timeout: 10s
